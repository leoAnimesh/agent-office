appId: com.leoanimesh.agentoffice
productName: AgentOffice
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  # The terminal's native PTY (and its prebuilt per-OS binaries) must live outside the asar to load and exec.
  - "**/node_modules/@lydell/node-pty*/**"
  # playwright-core reads its own scripts from disk and spawns the browser; keep it outside the asar.
  - "**/node_modules/playwright-core/**"
extraResources:
  - from: resources
    to: resources
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  # Flipping fuses edits the binary; re-sign ad-hoc so Apple silicon still runs the unsigned build.
  resetAdHocDarwinSignature: true
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb]
  category: Development
  maintainer: leoAnimesh <mondalarup808@gmail.com>
publish: null
